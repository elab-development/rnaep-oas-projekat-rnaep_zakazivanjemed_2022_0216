server:
  port: 8082

spring:
  application:
    name: appointment-service

  datasource:
    url: jdbc:mysql://localhost:3308/appointment_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: appointment_service
    password: appointment_pass
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

logging:
  level:
    com.medplatform: DEBUG