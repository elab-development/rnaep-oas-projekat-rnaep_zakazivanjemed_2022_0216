server:
  port: 8082

spring:
  application:
    name: appointment-service

  datasource:
    url: jdbc:mysql://localhost:3308/appointment_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: appointment_service
    password: appointment_pass
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  kafka:
      bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
      consumer:
        group-id: appointment-service
        auto-offset-reset: earliest

logging:
  level:
    com.medplatform: DEBUG

jwt:
  secret: ${JWT_SECRET:medplatform-super-secret-key-2024-very-long-string}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}