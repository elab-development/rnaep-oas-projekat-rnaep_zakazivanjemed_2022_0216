name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ── Testovi za Java servise ──
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [user-service, appointment-service, medical-records-service, notification-service, api-gateway]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Test ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        run: mvn -B verify

  # ── Build Docker image-a za sve servise ──
  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [user-service, appointment-service, medical-records-service, notification-service, api-gateway, medical-platform-ui]
    steps:
      - uses: actions/checkout@v4
      - name: Build image ${{ matrix.service }}
        run: docker build -t ${{ matrix.service }}:${{ github.sha }} ./${{ matrix.service }}